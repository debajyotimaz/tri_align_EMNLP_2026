# ========= MODEL =========
model:
  backend: vllm
  name_or_path: Qwen/Qwen2.5-72B-Instruct-GPTQ-Int4
  device: auto
  dtype: auto
  load_8bit: false
  revision: null
  trust_remote_code: true
  gpu_memory_utilization: 0.9
  max_model_len: 8192

# ========= DATA =========
data:
  source: file
  input_path: /path/val_english_prompts.parquet
  mode: chat
  fields:
    id: id
    text: prompt
  prompt_template: null
  chat:
    use_template: tokenizer
    system: "You are a helpful assistant."
    user_wrap: "{prompt}"
  max_seq_length: 1024

# ========= GENERATION =========
generation:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  do_sample: true
  repetition_penalty: 1.1
  num_beams: 1
  stop: []

# ========= RUNTIME =========
runtime:
  batch_size: 32
  seed: 42

# ========= OUTPUT =========
output:
  base_dir: /output-path/outputs
  run_name: sa_hineng_val_english_Qwen2.5-72B-Instruct-GPTQ-Int4
  save_config_copy: true